name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tar_name="taurus_x86_64.tar.gz"
          tar_name_sha256="$tar_name".sha256
          tar -czvf "$tar_name" target/release/taurus
          sha256sum "$tar_name" | awk '{print $1}' >"$tar_name_sha256"
          title="${{ github.ref }}"
          title="$(sed 's/^refs\/tags\///' <<<"$title")"
          gh release create --notes-from-tag --title "$title" "${{ github.ref }}" "$tar_name" "$tar_name_sha256"
