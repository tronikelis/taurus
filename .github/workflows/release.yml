name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  upload:
    strategy:
      matrix:
        runner:
          - name: ubuntu-24.04
            arch: amd64
          - name: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$(echo -n "${{ github.ref }}" | sed 's/^refs\/tags\///')"

          tar_name="taurus_${tag}_${{ matrix.runner.arch }}.tar.gz"
          tar_name_sha256="$tar_name".sha256

          mkdir -p bin
          mv target/release/taurus bin
          tar -czvf "$tar_name" bin
          sha256sum "$tar_name" >"$tar_name_sha256"
          files="$tar_name $tar_name_sha256"

          function release {
            gh release create \
              --notes-from-tag \
              --title "$tag" \
              "$tag" \
              $files
          }
          function update {
            gh release upload \
              "$tag" \
              $files
          }
          release || update
